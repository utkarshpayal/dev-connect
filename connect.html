<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Configuration</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #121826;
        color: #e1e1e1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 1.5rem;
        overflow: hidden;
        align-items: center;
      }
      .logo {
        width: fit-content;
        height: 50px;
        padding: 1rem;
        background: linear-gradient(135deg, #6b46c1 0%, #805ad5 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        font-weight: bold;
        font-size: 2.3em;
        box-shadow: 0 4px 15px rgba(107, 70, 193, 0.4);
        margin-bottom: 1.5rem;
      }
      .main-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 600px;
        width: 100%;
        background: #1c2333;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
      }
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 100%;
      }
      .input-group label {
        font-weight: 600;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #4a5568;
        border-radius: 6px;
        background-color: #2d3748;
        color: #e1e1e1;
        font-size: 1rem;
        outline: none;
        transition: 0.3s;
      }
      input:focus {
        border-color: #805ad5;
        box-shadow: 0 0 6px rgba(128, 90, 213, 0.7);
      }
      button {
        padding: 0.8rem;
        background: linear-gradient(135deg, #6b46c1 0%, #805ad5 100%);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.3s ease-in-out;
      }
      button:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(107, 70, 193, 0.5);
      }
      .result-section {
        background: #141a2e;
        border-radius: 8px;
        padding: 1rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 1rem;
        justify-content: space-between;
        margin-top: 1rem;
      }
      #connectorResult {
        flex: 1;
        font-family: "Consolas", monospace;
        padding: 0.8rem;
        background: #1c2333;
        border-radius: 6px;
        color: #ffffff;
        border: 1px solid #2d3748;
        min-height: 42px;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bottom-actions {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="logo">Dev Connect</div>
    <div class="main-container">
      <div class="input-group">
        <label for="connectorName">Connector Name</label>
        <input type="text" id="connectorName" class="data" placeholder="my-connector" />
      </div>

      <button onclick="parseConnector()">Connect</button>

      <div class="result-section">
        <div id="connectorResult">Awaiting connection...</div>
        <button onclick="copyToClipboard()">Copy</button>
      </div>
    </div>

    <script>
      const result = {};

      function parseConnector() {
        const connectorString = document.getElementById("connectorName").value.trim();
        const parts = connectorString.split("-");

        result.connectorName = parts[0];

        parts.slice(1).forEach((part) => {
          const [key, value] = part.split("=");
          if (value) {
            const [host, port] = value.split(":");
            result[key] = { host, port };
          }
        });

        document.getElementById("connectorResult").textContent = `http://localhost:${result.FE?.port || "8989"}`;
        console.log("result", result);

        const vscode = acquireVsCodeApi();
        vscode.postMessage({
          command: "getConnector",
          result,
          connectorString
        });
      }

      function copyToClipboard() {
        const text = document.getElementById("connectorResult").textContent;
        navigator.clipboard
          .writeText(text)
          .then(() => alert("Configuration copied to clipboard!"))
          .catch((err) => console.error("Failed to copy:", err));
      }
    </script>
  </body>
</html>
